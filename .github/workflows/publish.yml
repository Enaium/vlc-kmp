name: Publish

"on":
  workflow_dispatch:
    inputs:
      jobs:
        description: "Comma-separated: macos,linux,android,web,windows (empty = all)"
        required: false
        default: ""

# Maven Central coordinates are immutable, so every publication is produced by
# exactly one runner:
#
#   macos-15      -> metadata + jvm + macOS klibs + darwin JNI artifacts
#   ubuntu-latest -> linuxX64/linuxArm64/mingwX64 klibs + linux JNI artifacts
#   ubuntu-latest -> androidNative klibs + Android AAR
#   ubuntu-latest -> js/wasmJs klibs + npm package
#   windows-latest-> windows-x86_64 JNI artifact
#
# Required secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD,
# SIGNING_KEY, SIGNING_KEY_ID, SIGNING_PASSWORD, NPM_TOKEN (optional).

permissions:
  contents: read

jobs:
  publish-macos:
    name: Publish macOS (metadata, jvm, Apple klibs, darwin JNI)
    if: inputs.jobs == '' || contains(inputs.jobs, 'macos')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Checkout VLC submodule
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :vlc-kmp:publishKotlinMultiplatformPublicationToMavenCentralRepository
          :vlc-kmp:publishJvmPublicationToMavenCentralRepository
          :vlc-kmp:publishMacosArm64PublicationToMavenCentralRepository
          :vlc-kmp:publishMacosX64PublicationToMavenCentralRepository
          :jni-jvm-darwin-aarch64:publishMavenPublicationToMavenCentralRepository
          :jni-jvm-darwin-x86_64:publishMavenPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-linux:
    name: Publish Linux (linuxX64/linuxArm64/mingwX64 klibs, linux JNI)
    if: inputs.jobs == '' || contains(inputs.jobs, 'linux')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout VLC submodule
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :vlc-kmp:publishLinuxX64PublicationToMavenCentralRepository
          :vlc-kmp:publishLinuxArm64PublicationToMavenCentralRepository
          :vlc-kmp:publishMingwX64PublicationToMavenCentralRepository
          :jni-jvm-linux-x86_64:publishMavenPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-android:
    name: Publish Android (native klibs + AAR)
    if: inputs.jobs == '' || contains(inputs.jobs, 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout VLC submodule
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android NDK and platform
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            --install "ndk;27.0.12077973" "platforms;android-36" "cmake;3.22.1" >/dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :vlc-kmp:publishAndroidNativeArm64PublicationToMavenCentralRepository
          :vlc-kmp:publishAndroidNativeArm32PublicationToMavenCentralRepository
          :vlc-kmp:publishAndroidNativeX64PublicationToMavenCentralRepository
          :vlc-kmp:publishAndroidNativeX86PublicationToMavenCentralRepository
          :vlc-kmp:publishAndroidPublicationToMavenCentralRepository
          :android-jvm:publishMavenPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-web:
    name: Publish js/wasmJs klibs and npm package
    if: inputs.jobs == '' || contains(inputs.jobs, 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout VLC submodule
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :vlc-kmp:publishJsPublicationToMavenCentralRepository
          :vlc-kmp:publishWasmJsPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish npm
        if: env.NPM_TOKEN != ''
        run: ./gradlew --no-daemon :vlc-kmp:publishWasmNpm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-windows:
    name: Publish Windows JNI artifact
    if: inputs.jobs == '' || contains(inputs.jobs, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout VLC submodule
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install CMake and Ninja
        shell: pwsh
        run: |
          choco install cmake ninja --no-progress -y
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )

      - name: Publish
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :jni-jvm-windows-x86_64:publishMavenPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
