[versions]
kotlin = "2.4.21"
agp = "9.5.1"
coroutines = "1.10.2"
atomicfu = "0.29.0"
kotlinx-browser = "0.5.0"
junit = "5.11.0"
junit-platform = "1.11.0"
maven-publish = "0.37.0"
imgui-kmp = "1.0.17-fixed.1.93.0"
sdl-kmp = "1.0.14-fixed.3.4.18"
imgui-kmp-npm = "1.0.17-fixed.1.93.0"
sdl-kmp-npm = "1.0.14-fixed.3.4.18"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }
imgui-kmp = { module = "cn.enaium.imgui:imgui-kmp", version.ref = "imgui-kmp" }
sdl-kmp = { module = "cn.enaium.sdl:sdl-kmp", version.ref = "sdl-kmp" }
sdl-kmp-android-jvm = { module = "cn.enaium.sdl:sdl-kmp-android-jvm", version.ref = "sdl-kmp" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
